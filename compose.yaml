services:

  hello-service:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: hello-service
    ports: 
      - "${SERVER_PORT:-8080}:8080" 
    environment:  
      - GREETING=${GREETING:-Hello}
      - NAME=${NAME:-World}
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]  
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped  
