services:
  hello-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hello-service
    ports:
      - "8080:8080"
    environment:
      - GREETING=Hello
      - NAME=DevOps
      - SERVER_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
